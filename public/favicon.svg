<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&amp;display=swap');
      .monogram {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 600;
        font-style: italic;
        font-size: 34px;
        fill: #FAF9F5;
      }
    </style>
  </defs>

  <!-- Base Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="#3A7F76" />

  <!-- Subtle Inner Border Frame -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#FAF9F5" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Cloche Dome / Tasting Arc -->
  <path d="M18 20 Q32 12 46 20" fill="none" stroke="#FAF9F5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="32" cy="14" r="2" fill="#FAF9F5" />

  <!-- Central Monogram "T" -->
  <text x="32" y="47" text-anchor="middle" class="monogram">T</text>
</svg>
